<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indienststelling Rapport</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="control-panel">
        <div class="panel-header">
          <p class="eyebrow">Invulbare versie</p>
          <h1>Indienststelling Rapport</h1>
          <p class="panel-copy">
            Pas alle gemarkeerde velden aan en exporteer daarna een nette PDF.
          </p>
        </div>

        <form id="field-form" class="field-form"></form>

        <div class="panel-actions">
          <button id="reset-button" type="button" class="ghost-button">Leegmaken</button>
          <button id="print-button" type="button" class="primary-button">Exporteer als PDF</button>
        </div>
      </aside>

      <main class="document-stage">
        <div class="document-toolbar">
          <span id="status-pill" class="status-pill">Document laden...</span>
          <span class="hint">Tip: vul links in of klik rechtstreeks in het document.</span>
        </div>

        <div id="document-frame" class="document-frame">
          <div id="page-shell" class="page-shell" aria-label="Documentweergave">
            <canvas id="pdf-canvas" class="pdf-canvas"></canvas>
            <div id="overlay" class="overlay" aria-label="Invulvelden"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
